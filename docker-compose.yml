# NEXUS Trading Intelligence — self-hosting.
#
#   docker compose up -d --build    # → http://localhost:3000
#
# No keys, database or other services are required. Optionally copy
# .env.example to .env.local to add free-tier keys for extra coverage.
#
# Secrets (if any) are read from .env.local at RUN time. They are not part of
# the image. See docs/SELF_HOSTING.md before exposing this to the internet.

services:
  app:
    build: .
    image: nexus-trading:local
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      # One reverse proxy / load balancer in front of the app. Raise this if
      # you chain more (e.g. CDN → nginx → app = 2). See docs/SELF_HOSTING.md.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      # Bound to localhost on purpose: put a TLS-terminating reverse proxy in
      # front instead of publishing the app port directly.
      - "127.0.0.1:${NEXUS_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
